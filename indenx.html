<style>
/* ==========================================================================
   1. ROOT VARIABLES & THEME SYSTEM
   ========================================================================== */

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-inverse: #0f172a;
  
  --border-subtle: #24324f;
  --border-strong: #334155;
  --border-accent: rgba(59, 130, 246, 0.4);
  
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow: rgba(59, 130, 246, 0.25);
  
  --color-kubus: #38bdf8;
  --color-balok: #a855f7;
  --color-limas: #f97316;
  --color-prisma: #10b981;
  --color-tabung: #ec4899;
  --color-kerucut: #eab308;
  --color-segi6: #14b8a6;
  --color-kosong: #64748b;
  
  --success: #22c55e;

  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.12);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --info: #0284c7;
  --info-bg: rgba(2, 132, 199, 0.12);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 40px -8px rgba(0, 0, 0, 0.6);

  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ==========================================================================
   2. GLOBAL RESET & BASE STYLES
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-body);
  color: var(--text-primary);
  line-height: 1.65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  overscroll-behavior-y: none;
}

/* ==========================================================================
   3. HEADER & NAVIGATION
   ========================================================================== */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--bg-surface-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-sm);
}

.header-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-primary);
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.5px;
  cursor: pointer;
  user-select: none;
}

.brand-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--primary), #8b5cf6);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  box-shadow: var(--shadow-glow);
}

.brand-text span {
  background: linear-gradient(135deg, #60a5fa, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-pills-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.nav-pills-wrap::-webkit-scrollbar { display: none; }

.pill-btn {
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-secondary);
  padding: 7px 14px;
  border-radius: var(--radius-full);
  font-size: 0.84rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: var(--transition-fast);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pill-btn:hover {

  color: var(--text-primary);
  border-color: var(--border-strong);
}

.pill-btn.active {

  border-color: var(--primary);
  box-shadow: 0 0 16px var(--primary-glow);
}

/* ==========================================================================
   4. LAYOUT CONTAINERS
   ========================================================================== */
.main-wrapper {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 16px 40px;
  flex: 1;
}

/* ==========================================================================
   5. HOME VIEW (MENU DASHBOARD)
   ========================================================================== */

.hero-section {

.grid-cards {

.module-card {

  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;

  overflow: hidden;
  transition: var(--transition-normal);
  box-shadow: var(--shadow-sm);
}

.module-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: var(--card-accent, var(--primary));
  opacity: 0.8;
  transition: var(--transition-fast);
}

.module-card:hover {
  transform: translateY(-4px);
  border-color: var(--card-accent, var(--primary));
  box-shadow: var(--shadow-lg), 0 0 25px rgba(0, 0, 0, 0.4);
}

.card-head {

  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.badge-shape {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #ffffff;
  background: var(--card-accent, var(--primary));
}

.card-num {

  font-weight: 800;
  color: var(--text-muted);
}

.card-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.4;
}

.card-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 18px;
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--card-accent, var(--primary));

.card-arrow {

  height: 28px;

  display: flex;
  align-items: center;
  justify-content: center;

}

.module-card:hover .card-arrow {

  background: var(--card-accent, var(--primary));

}

/* =========================================================
   6. QUIZ & INTERACTIVE 3D VIEW
   ========================================================= */
#quizView {

}

.quiz-container {

  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 24px;
  box-shadow: var(--shadow-md);
}

.action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-fast);
}

.btn-back:hover {
  background: #334155;
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.tab-nav {
  display: flex;
  background: var(--bg-input);
  padding: 5px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  margin-bottom: 22px;
}

.tab-btn {
  flex: 1;
  text-align: center;
  padding: 10px 18px;
  font-weight: 700;
  font-size: 0.92rem;
  border-radius: var(--radius-md);
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: var(--transition-fast);
}

.tab-btn.active {
  background: var(--bg-surface-elevated);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

/* =========================================================
   7. SOAL BOX & STYLING (PRESERVED 100%)
   ========================================================= */
.soal-card {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  line-height: 1.75;
  font-size: 0.98rem;
}

.soal-card h1, .soal-card h2 {
  color: #ffffff;
  margin-bottom: 14px;
  font-size: 1.35rem;
}

.formula, .data {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  padding: 12px 18px;
  margin: 12px 0;
  border-radius: var(--radius-md);
  text-align: center;
  font-weight: 800;
  color: #38bdf8;
  font-size: 1.05rem;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
}

.info-box {
  background: var(--info-bg);
  border-left: 4px solid var(--info);
  padding: 16px 20px;
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  margin-top: 18px;
  color: #e0f2fe;
  font-size: 0.94rem;
}

.note, .warning {
  background: var(--warning-bg);
  border-left: 4px solid var(--warning);
  padding: 16px 20px;
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  margin-top: 18px;
  color: #fef3c7;
  font-size: 0.94rem;
}

.btn-primary-action {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary), #2563eb);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 20px var(--primary-glow);
  transition: var(--transition-fast);
}

.btn-primary-action:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
}

.btn-primary-action:active {
  transform: scale(0.99);
}

/* =========================================================
   8. PEMBAHASAN 3D WORKSPACE
   ========================================================= */
.pembahasan-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 20px;
}

@media(max-width: 960px) {
  .pembahasan-grid {
    grid-template-columns: 1fr;
  }
}

.viewport-3d {
  position: relative;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: #020617;
  overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
}

canvas#renderCanvas {
  width: 100%;
  height: 480px;
  display: block;
  touch-action: none;
}

@media(max-width: 600px) {
  canvas#renderCanvas {
    height: min(52vh, 410px);
  }
}

.viewport-toolbar {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.btn-tool {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--border-strong);
  background: rgba(30, 41, 59, 0.88);
  backdrop-filter: blur(8px);
  color: var(--text-primary);
  font-size: 1.2rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition-fast);
  box-shadow: var(--shadow-sm);
  user-select: none;
}

.btn-tool:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 0 14px var(--primary-glow);
}

.btn-tool:active {
  transform: scale(0.92);
}

.gesture-hint {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  font-size: 0.76rem;
  color: var(--text-secondary);
  text-align: center;
  pointer-events: none;
  user-select: none;
}

/* =========================================================
   9. STEP EXPLANATION PANEL
   ========================================================= */
.step-panel {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 380px;
}

.step-header {
  font-size: 1.18rem;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
}

.step-body {
  flex-grow: 1;
  font-size: 0.94rem;
  line-height: 1.7;
  color: var(--text-secondary);
}

.step-body b {
  color: #ffffff;
}

.answer {
  background: var(--success-bg);
  border: 1px solid rgba(34, 197, 94, 0.4);
  color: #4ade80;
  padding: 16px;
  border-radius: var(--radius-md);
  text-align: center;
  font-size: 1.28rem;
  font-weight: 800;
  margin-top: 14px;
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
}

.step-nav-bar {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn-nav-step {
  flex: 1;
  padding: 13px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
  font-weight: 800;
  font-size: 0.88rem;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition-fast);
}

.btn-nav-step:hover:not(:disabled) {
  background: #334155;
  border-color: #64748b;
}

.btn-nav-step:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.progress-info {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  margin-top: 10px;
}

/* =========================================================
   10. ANIMATIONS & RESPONSIVE TWEAKS
   ========================================================= */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 640px) {
  .hero-title { font-size: 1.75rem; }
  .main-wrapper { padding: 14px 10px 30px; }
  .quiz-container { padding: 16px; }
}
</style>
</head>

     HEADER / NAVIGATION BAR

<header>
  <div class="header-container">

</header>

<main class="main-wrapper">

  <section id="homeView">

<script>
/* =========================================================
   GLOBAL STATE & PROJECTION VARIABLES
   ========================================================= */
let currentQuestionIndex = 0;
let currentStep = 0;

let rotX = -0.42;
let rotY = 0.65;
let scale = 25;
let panX = 0;
let panY = 0;

const canvas = document.getElementById("renderCanvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

/* =========================================================
   DATABASE 8 SOAL LENGKAP (SOAL 1-7 PERSIS 100%, SOAL 8 KOSONG)
   ========================================================= */
const questions = [
  // --- NOMOR 1 ---
  {
    id: 1,
    title: "Nomor 1",
    shape: "Kubus",
    accent: "var(--color-kubus)",
    desc: "Kubus ABCD.EFGH rusuk 12 cm. Titik P' pada diagonal AC dengan AP' = 3√2 cm, PP' = 3 cm ke bidang BDG.",
    soalHTML: `
      <h1>📐 Soal Dimensi Tiga</h1>
      <p>Diketahui kubus <b>ABCD.EFGH</b> memiliki panjang rusuk <b>12 cm</b>.</p>
      <p>Titik <b>P</b> berada di dalam kubus. Proyeksi tegak lurus titik P pada bidang <b>ABCD</b> adalah titik <b>P′</b>.</p>
      <p>Titik P′ terletak pada diagonal <b>AC</b>, dengan:</p>
      <div class="formula">AP′ = 3√2 cm</div>
      <div class="formula">PP′ = 3 cm</div>
      <p>Tentukan jarak terpendek titik <b>P</b> ke bidang <b>BDG</b>.</p>
    `,
    steps: [
      {

/* =========================================================
   3D ENGINE PROJECTION & PRIMITIVES
   ========================================================= */
function project(p) {
  let x = p[0], y = p[1], z = p[2];
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  let x1 = x * cy - z * sy;
  let z1 = x * sy + z * cy;

  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  let y1 = y * cx - z1 * sx;
  let z2 = y * sx + z1 * cx;

  const camera = 55;
  let persp = camera / (camera - z2);

  return {
    x: W / 2 + panX + x1 * scale * persp,
    y: H / 2 + panY - y1 * scale * persp
  };
}

function line3D(a, b, color = "#475569", width = 2, dashed = false) {
  const p = project(a), q = project(b);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(q.x, q.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dashed ? [6, 5] : []);
  ctx.stroke();
  ctx.setLineDash([]);
}

function dot3D(p, r = 4, color = "#94a3b8") {
  const q = project(p);
  ctx.beginPath();
  ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function label3D(text, p, dx = 0, dy = 0) {
  const q = project(p);
  ctx.font = "bold 13px sans-serif";
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.fillRect(q.x + dx - tw/2 - 3, q.y + dy - 12, tw + 6, 17);
  ctx.fillStyle = "#f8fafc";
  ctx.textAlign = "center";
  ctx.fillText(text, q.x + dx, q.y + dy);
}

function drawPoly3D(pts, fill, stroke, width = 2) {
  const ps = pts.map(project);
  ctx.beginPath();
  ctx.moveTo(ps[0].x, ps[0].y);
  for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i].x, ps[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = width;
  ctx.stroke();
}

function drawCircle3D(z, r, stroke = "#475569") {
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const a = (i / 60) * Math.PI * 2;
    const p = project([r * Math.cos(a), r * Math.sin(a), z]);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 1.8;
  ctx.stroke();
}

function render() {
  if (W <= 0 || H <= 0) return;
  ctx.clearRect(0, 0, W, H);
  questions[currentQuestionIndex].draw(currentStep);
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (W < 400 && scale > 22) scale = 18;
  render();
}

/* =========================================================
   UI CONTROLS & NAVIGATION
   ========================================================= */
function initUI() {
  const navContainer = document.getElementById("navItems");
  const gridContainer = document.getElementById("gridMenu");

  // Home Pill Button
  const homeBtn = document.createElement("button");
  homeBtn.className = "pill-btn active";
  homeBtn.id = "btnNav_home";
  homeBtn.innerHTML = "🏠 Menu";
  homeBtn.onclick = showHome;
  navContainer.appendChild(homeBtn);

  questions.forEach((q, idx) => {
    // Header Nav Pills
    const btn = document.createElement("button");
    btn.className = "pill-btn";
    btn.id = `btnNav_${idx}`;
    btn.textContent = `No. ${q.id}`;
    btn.onclick = () => selectQuestion(idx);
    navContainer.appendChild(btn);

    // Dashboard Grid Cards
    const card = document.createElement("div");
    card.className = "module-card";
    card.style.setProperty("--card-accent", q.accent);
    card.onclick = () => selectQuestion(idx);
    card.innerHTML = `
      <div>
        <div class="card-head">
          <span class="badge-shape">${q.shape}</span>
          <span class="card-num">#0${q.id}</span>
        </div>
        <h3 class="card-title">Nomor ${q.id}</h3>
        <p class="card-desc">${q.desc}</p>
      </div>
      <div class="card-foot">
        <span>Buka Pembahasan</span>
        <div class="card-arrow">➔</div>
      </div>
    `;
    gridContainer.appendChild(card);
  });

  window.addEventListener("resize", resizeCanvas);
  setupTouchAndPointerGestures();
}

function showHome() {
  document.getElementById("homeView").style.display = "block";
  document.getElementById("quizView").style.display = "none";

  document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("btnNav_home").classList.add("active");
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectQuestion(idx) {
  currentQuestionIndex = idx;
  currentStep = 0;
  panX = 0;
  panY = 0;

  document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
  const activeBtn = document.getElementById(`btnNav_${idx}`);
  if (activeBtn) activeBtn.classList.add("active");

  document.getElementById("homeView").style.display = "none";
  document.getElementById("quizView").style.display = "block";

  const q = questions[idx];
  const badgeEl = document.getElementById("quizBadge");
  badgeEl.textContent = `${q.shape} • Nomor ${q.id}`;
  badgeEl.style.backgroundColor = q.accent;

  document.getElementById("soalContent").innerHTML = q.soalHTML;
  switchTab("soal");
  updateStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab) {
  const isSolusi = tab === "solusi";
  document.getElementById("tabSoal").classList.toggle("active", !isSolusi);
  document.getElementById("tabSolusi").classList.toggle("active", isSolusi);
  document.getElementById("soalContainer").style.display = isSolusi ? "none" : "block";
  document.getElementById("solusiContainer").style.display = isSolusi ? "block" : "none";

  if (isSolusi) {
    setTimeout(resizeCanvas, 60);
  }
}

function updateStep() {
  const q = questions[currentQuestionIndex];
  const stepData = q.steps[currentStep];

  document.getElementById("stepTitle").textContent = stepData.title;
  document.getElementById("stepText").innerHTML = stepData.text;
  document.getElementById("progressText").textContent = `Langkah ${currentStep + 1} dari ${q.steps.length}`;

  document.getElementById("btnPrev").disabled = currentStep === 0;
  document.getElementById("btnNext").disabled = currentStep === q.steps.length - 1;

  render();
}

function nextStep() {
  if (currentStep < questions[currentQuestionIndex].steps.length - 1) {
    currentStep++;
    updateStep();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    updateStep();
  }
}

function zoom(factor) {
  scale = Math.max(10, Math.min(65, scale * factor));
  render();
}

function resetCam() {
  rotX = -0.42;
  rotY = 0.65;
  scale = (W < 400) ? 18 : 25;
  panX = 0;
  panY = 0;
  render();
}

/* =========================================================
   MULTI-TOUCH GESTURE ENGINE (PINCH ZOOM & 2-FINGER PAN)
   ========================================================= */
function setupTouchAndPointerGestures() {
  const activeTouches = new Map();
  let prevPinchDist = 0;
  let prevMidX = 0, prevMidY = 0;
  let lastX = 0, lastY = 0;

  function getDistance(p1, p2) {
    return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
  }

  function getMidpoint(p1, p2) {
    return {
      x: (p1.clientX + p2.clientX) / 2,
      y: (p1.clientY + p2.clientY) / 2
    };
  }

  canvas.addEventListener("pointerdown", e => {
    activeTouches.set(e.pointerId, e);
    canvas.setPointerCapture(e.pointerId);

    if (activeTouches.size === 1) {
      lastX = e.clientX;
      lastY = e.clientY;
    } else if (activeTouches.size === 2) {
      const [p1, p2] = Array.from(activeTouches.values());
      prevPinchDist = getDistance(p1, p2);
      const mid = getMidpoint(p1, p2);
      prevMidX = mid.x;
      prevMidY = mid.y;
    }
  });

  canvas.addEventListener("pointermove", e => {
    if (!activeTouches.has(e.pointerId)) return;
    activeTouches.set(e.pointerId, e);

    if (activeTouches.size === 1) {
      // 1 JARI: ROTASI 3D
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      rotY += dx * 0.008;
      rotX = Math.max(-1.35, Math.min(1.35, rotX + dy * 0.006));

      lastX = e.clientX;
      lastY = e.clientY;
      render();

    } else if (activeTouches.size === 2) {
      // 2 JARI: PINCH ZOOM + PAN GESER
      const [p1, p2] = Array.from(activeTouches.values());
      
      const curDist = getDistance(p1, p2);
      if (prevPinchDist > 0 && curDist > 0) {
        const factor = curDist / prevPinchDist;
        scale = Math.max(10, Math.min(65, scale * factor));
      }
      prevPinchDist = curDist;

      const mid = getMidpoint(p1, p2);
      panX += (mid.x - prevMidX);
      panY += (mid.y - prevMidY);
      prevMidX = mid.x;
      prevMidY = mid.y;

      render();
    }
  });

  function endTouch(e) {
    activeTouches.delete(e.pointerId);
    try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    
    if (activeTouches.size === 1) {
      const remaining = activeTouches.values().next().value;
      lastX = remaining.clientX;
      lastY = remaining.clientY;
    }
  }

  canvas.addEventListener("pointerup", endTouch);
  canvas.addEventListener("pointercancel", endTouch);

  // Mouse wheel zoom untuk laptop / PC
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.12 : 0.88);
  }, { passive: false });
}

// Inisialisasi awal aplikasi
window.addEventListener("DOMContentLoaded", () => {
  initUI();
  showHome();
});
</script>
